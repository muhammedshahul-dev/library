<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Library</h1>
        <p>
            This is a project for <a href="https://www.theodinproject.com/" target="_blank">The Odin Project</a> in which I have to make a library using Object Constructors and LocalStorage.
            You can also view the <a href="https://github.com/muhammedshahul-dev/library" target="_blank">GitHub repository </a>of this project.
        </p>
    </header>
    <main>
        <div>
            <form class="library-form" id="libraryForm">
                <div class="form-inputs">
                    <div class="inputs">
                        <label for="title">Title</label>
                        <input type="text" name="title" id="title" required>
                    </div>
                    <div class="inputs">
                        <label for="author">Author</label>
                        <input type="text" name="author" id="author" required>
                    </div>
                    <div class="inputs">
                        <label for="pages">Pages</label>
                        <input type="number" name="pages" id="pages" required min="1">
                    </div>
                    <div class="inputs">
                        <label for="read">Read</label>
                        <select name="read" id="read">
                            <option value="true">Read</option>
                            <option value="false">Not Read</option>
                        </select>
                    </div>
                </div>
                <input type="submit" value="Submit" class="submit">
            </form>
        </div>
        <div id="libraryDisplay">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="libraryTableBody">

                </tbody>
            </table>
        </div>
    </main>
    <footer></footer>
    <script src="app.js"></script>
</body>
</html>
