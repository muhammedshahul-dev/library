<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>
            My library
        </h1>
        <h2>
            this is a project for <a href="https://www.theodinproject.com/">The Odin Project</a> in which I have to make a library using Object Constructors and LocalStorage.
            You can also view the Github repository of this project.
        </h2>
    </header>
    <main>
        <div>
            <form class="library-form">
                <div class="form-inputs">
                    <div class="">
                        <label for="title">title</label>
                        <input type="text" name="title" id="title">
                    </div>
                    <div class="">
                        <label for="author">author</label>
                        <input type="text" name="author" id="author">
                    </div>
                    <div class="">
                        <label for="read">read</label>
                        <select name="read" id="read">
                            <option value="true">read</option>
                            <option value="false">not read</option>
                        </select>
                        
                    </div>
                </div>
                <input type="submit" value="submit">
            </form>
        </div>
    </main>
    <footer>

    </footer>
    <script src="app.js"></script>
</body>

</html>
